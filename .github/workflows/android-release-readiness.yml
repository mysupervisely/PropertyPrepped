name: Android Release Bundle Readiness
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'mobile/scripts/android-release.py'
      - 'mobile/scripts/test-android-release.py'
      - 'codemagic.yaml'
      - '.github/workflows/android-release-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-release-validation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ios-readiness-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test release validation
        run: python3 mobile/scripts/test-android-release.py
      - name: Install and sync Android shell
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Configure Android SDK
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties
      - name: Compile unsigned release bundle and run lint
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon -PproprosterUnsignedValidation=true :app:bundleRelease :app:lintRelease
      - name: Verify release packaging without signing credentials
        run: python3 mobile/scripts/android-release.py unsigned-validation
      - name: Preserve validation report (no unsigned bundle distribution)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-readiness
          path: |
            android-release-evidence/**
            mobile/android/app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 3
