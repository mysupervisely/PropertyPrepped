name: Android TWA unsigned build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-twa/**'
      - '.github/workflows/android-twa-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap from runner toolchain
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME+"/.bubblewrap/config.json",JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME}))'
          echo "Bubblewrap toolchain configuration prepared."
      - name: Generate Android project from production manifest
        working-directory: android-twa
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          # Bubblewrap init is interactive. Run with a pseudo-terminal and capture
          # the prompts for a deterministic, reviewed initialization step.
          python3 -m pip install --user pexpect
          python3 - <<'PY'
          import pexpect
          import sys
          child = pexpect.spawn('bubblewrap init --manifest https://proproster.com/manifest.webmanifest', encoding='utf-8', timeout=40)
          child.logfile_read = sys.stdout
          answers = [
              ('Domain:', 'proproster.com'),
              ('URL path:', '/'),
              ('Application name:', 'PropRoster'),
              ('Short name:', 'PropRoster'),
              ('Application ID:', 'com.proproster.app'),
          ]
          for prompt, answer in answers:
              index = child.expect([prompt, pexpect.EOF, pexpect.TIMEOUT])
              if index != 0:
                  raise RuntimeError('Bubblewrap initialization stopped before prompt: '+prompt)
              child.sendline(answer)
          # Stop here until remaining Bubblewrap prompts have been audited.
          child.close(force=True)
          raise RuntimeError('Initial Bubblewrap prompts captured. Complete remaining prompts before producing an AAB.')
          PY
      - name: Validate generated Android project
        working-directory: android-twa
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::Bubblewrap did not generate gradlew. The CI command must be made noninteractive before compilation can proceed."
            ls -la
            exit 1
          fi
          grep -R -q 'com.proproster.app' app/build.gradle* || {
            echo 'Generated application ID does not match Play Console'; exit 1;
          }
      - name: Build unsigned Android App Bundle
        working-directory: android-twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Upload unsigned bundle for engineering review
        uses: actions/upload-artifact@v4
        with:
          name: proproster-unsigned-aab-NOT-FOR-PLAY
          path: android-twa/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
