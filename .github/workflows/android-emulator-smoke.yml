name: Android Emulator Screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'mobile/scripts/android-emulator-smoke.py'
      - 'mobile/scripts/run-android-auth-tests.sh'
      - 'mobile/scripts/test-android-auth-runner.py'
      - 'mobile/android/app/src/androidTest/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ios-readiness-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CM_BUILD_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Validate packaging checks
        run: |
          python3 mobile/scripts/test-debug-apk.py
          python3 mobile/scripts/test-android-auth-runner.py
      - name: Install and sync mobile dependencies
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Configure Android SDK
        run: |
          test -d "$ANDROID_HOME"
          printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > mobile/android/local.properties
      - name: Build and verify debug APK
        run: |
          cd mobile/android
          bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          cd ../..
          python3 mobile/scripts/verify-debug-apk.py
      - name: Enable hardware acceleration for the ephemeral runner
        run: |
          test -c /dev/kvm
          sudo chown "$(id -un)" /dev/kvm
      - name: Run native Android auth-entry tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash mobile/scripts/run-android-auth-tests.sh
      - name: Save APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proproster-android-emulator
          retention-days: 3
          if-no-files-found: warn
          path: |
            android-emulator-evidence/
            android-build-evidence/
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/lint-results-debug.*
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
