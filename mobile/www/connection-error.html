<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Connect to PropRoster</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7f9; color: #172b3a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 420px; }
    .brand { font-weight: 750; font-size: 20px; margin-bottom: 40px; }
    h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.15; letter-spacing: -.025em; }
    p { line-height: 1.6; }
    .hint { font-size: 14px; color: #4c6170; }
    a { display: block; text-align: center; margin-top: 28px; padding: 16px 20px; background: #172b3a; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 650; min-height: 48px; }
    a:focus-visible { outline: 3px solid #b47712; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { :root { background: #111c25; color: #f5f7f9; } .hint { color: #bdcbd5; } a { background: #e6edf2; color: #172b3a; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">PropRoster</div>
    <h1>We couldn’t connect.</h1>
    <p>Check your internet connection and try again. PropRoster may also be temporarily unavailable.</p>
    <p class="hint">You need an internet connection to access your account. If you were saving something, check whether it was saved after reconnecting.</p>
    <a href="https://proproster.com">Try again</a>
  </main>
</body>
</html>
