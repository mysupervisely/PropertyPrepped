## PropRoster Mobile M4 — cloud iOS build → TestFlight (internal testing only).
##
## Why Codemagic and not Apple's own Xcode Cloud: Xcode Cloud's *first*
## workflow must be configured from inside the local Xcode app (Apple's
## own documentation, "Configuring your first Xcode Cloud workflow":
## "Use Xcode to initially configure your project or workspace to use
## Xcode Cloud"). There is no local Mac/Xcode available for this
## project, so that bootstrap step is not possible. Codemagic builds
## entirely from this YAML file on a cloud macOS runner and never
## requires opening Xcode.
##
## No secrets live in this file. The three App Store Connect API key
## values below are read from a Codemagic-managed encrypted variable
## group (Team settings → Environment variables → group
## "appstore_credentials"), created once in the Codemagic UI, never
## committed here. See mobile/README.md's "Path B" section.
##
## This workflow is NOT wired to auto-trigger on push (no `triggering:`
## block) — for M4 it is started manually from the Codemagic dashboard,
## deliberately, while this is still a first-build/bring-up milestone.

workflows:
  ios-simulator-unsigned:
    name: PropRoster iOS Simulator (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install mobile dependencies
        script: cd mobile && npm ci
      - name: Sync existing native iOS project
        script: cd mobile && npx cap sync ios
      - name: Compile unsigned iOS Simulator app
        script: |
          cd mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$CM_BUILD_DIR/ios-simulator-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone simulator and capture screenshots
        script: python3 ios/scripts/simulator-smoke.py
    artifacts:
      - ios-simulator-evidence/**
      - ios-simulator-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-ui-tests:
    name: PropRoster iOS UI Tests (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install mobile dependencies
        script: cd mobile && npm ci
      - name: Sync existing native iOS project
        script: cd mobile && npx cap sync ios
      - name: Compile unsigned iOS Simulator app
        script: |
          cd mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$CM_BUILD_DIR/ios-simulator-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone simulator and capture screenshots
        script: python3 ios/scripts/simulator-smoke.py
      - name: Check connection recovery and login/signup entry
        script: python3 ios/scripts/run-simulator-checks.py
    artifacts:
      - ios-simulator-evidence/**
      - ios-simulator-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: PropRoster iOS — TestFlight (internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.proproster.app
      groups:
        - appstore_credentials
      vars:
        XCODE_PROJECT: "mobile/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.proproster.app"
      node: 22
      xcode: latest

    scripts:
      - name: Install mobile shell dependencies
        script: |
          cd mobile
          npm ci

      - name: Capacitor sync (iOS)
        script: |
          cd mobile
          npx cap sync ios

      - name: Check TestFlight publishing configuration
        script: python3 ios/scripts/testflight-preflight.py

      - name: Apply distribution signing profiles
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT" \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build and archive signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-debug:
    name: PropRoster Android Debug APK (Capacitor, test only)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
    scripts:
      - name: Validate APK packaging checks
        script: python3 mobile/scripts/test-debug-apk.py
      - name: Install mobile dependencies
        script: cd mobile && npm ci
      - name: Sync existing native Android project
        script: cd mobile && npx cap sync android
      - name: Set Android SDK location
        script: |
          test -n "$ANDROID_SDK_ROOT"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
      - name: Compile debug APK and run Android lint
        script: |
          cd mobile/android
          bash ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify packaged Android configuration and recovery assets
        script: python3 mobile/scripts/verify-debug-apk.py
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
      - mobile/android/app/build/reports/lint-results-debug.*
      - android-build-evidence/**
